workflows:
  android-debug:
    name: PocketKit Android Debug APK

    environment:
      node: 22
      java: 17

    scripts:

      - name: Force pnpm
        script: |
          unset npm_config_user_agent
          corepack disable
          npm install -g pnpm@10.12.4
          pnpm --version

      - name: Clean
        script: |
          rm -rf node_modules
          rm -rf artifacts/pocketkit/node_modules
          rm -f package-lock.json
          rm -f yarn.lock

      - name: Install
        script: |
          pnpm install --force

      - name: Build Web
        script: |
          cd artifacts/pocketkit
          pnpm run build

      - name: Sync Android
        script: |
          cd artifacts/pocketkit
          pnpm exec cap sync android

      - name: Build APK
        script: |
          cd artifacts/pocketkit/android
          chmod +x gradlew
          ./gradlew assembleDebug

    artifacts:
      - artifacts/pocketkit/android/app/build/outputs/apk/debug/app-debug.apk
