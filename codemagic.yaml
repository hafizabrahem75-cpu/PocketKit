workflows:
  android-debug:
    name: PocketKit Android Debug APK

    instance_type: mac_mini_m2

    environment:
      node: 22
      java: 17

    scripts:

      - name: Setup pnpm
        script: |
          corepack enable
          corepack prepare pnpm@10.12.4 --activate
          pnpm --version

      - name: Clean old files
        script: |
          rm -rf node_modules
          rm -rf artifacts/pocketkit/node_modules
          pnpm store prune

      - name: Install dependencies
        script: |
          pnpm install --force

      - name: Build PocketKit Web
        script: |
          cd artifacts/pocketkit
          pnpm run build

      - name: Capacitor Android Sync
        script: |
          cd artifacts/pocketkit
          pnpm exec cap sync android

      - name: Build APK
        script: |
          cd artifacts/pocketkit/android
          chmod +x gradlew
          ./gradlew assembleDebug

    artifacts:
      - artifacts/pocketkit/android/app/build/outputs/apk/debug/app-debug.apk
