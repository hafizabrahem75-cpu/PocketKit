workflows:
  android-debug:
    name: PocketKit Android Debug APK

    instance_type: linux_x2

    environment:
      node: 22
      java: 17

    scripts:
      - name: Install dependencies
        script: |
          corepack enable
          corepack prepare pnpm@10 --activate
          pnpm install --force

      - name: Build Web
        script: |
          cd artifacts/pocketkit
          pnpm run build

      - name: Sync Capacitor
        script: |
          cd artifacts/pocketkit
          pnpm exec cap sync android

      - name: Build APK
        script: |
          cd artifacts/pocketkit/android
          chmod +x gradlew
          ./gradlew assembleDebug

    artifacts:
      - artifacts/pocketkit/android/app/build/outputs/apk/debug/app-debug.apk
