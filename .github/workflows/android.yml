name: Build PocketKit APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Enable pnpm
        run: corepack enable

      - name: Configure pnpm
        run: |
          pnpm config set ignore-scripts false
          pnpm config set enable-pre-post-scripts true

      - name: Install dependencies
        run: pnpm install

      - name: Capacitor sync
        run: |
          cd artifacts/pocketkit
          pnpm exec cap sync android

      - name: Build APK
        run: |
          cd artifacts/pocketkit/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketKit-debug-apk
          path: artifacts/pocketkit/android/app/build/outputs/apk/debug/app-debug.apk
