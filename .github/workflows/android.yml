name: Build PocketKit APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate
          pnpm --version

      - name: Clean cache
        run: |
          rm -rf node_modules
          rm -rf artifacts/pocketkit/node_modules
          pnpm store prune

      - name: Install dependencies
        run: |
          pnpm install --no-frozen-lockfile
          pnpm approve-builds --all || true

      - name: Build Web
  env:
    PORT: 3000
  run: |
    cd artifacts/pocketkit
    pnpm run build

      - name: Capacitor sync
        run: |
          cd artifacts/pocketkit
          pnpm exec cap sync android

      - name: Build APK
        run: |
          cd artifacts/pocketkit/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketKit-debug-apk
          path: artifacts/pocketkit/android/app/build/outputs/apk/debug/app-debug.apk
